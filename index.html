<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kindred — 找回家的牠</title>
    <meta name="description" content="連結每一位等待被愛的毛孩與溫暖家庭。" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#" aria-label="Kindred 首頁">
        <span class="brand-symbol" aria-hidden="true">K</span>
        <span>KINDRED</span>
      </a>
      <nav aria-label="主要導覽">
        <a href="#animals">尋找毛孩</a>
        <a href="#about">關於我們</a>
        <a href="#journal">領養日誌</a>
      </nav>
      <button class="header-action" type="button" data-scroll="#animals">開始領養</button>
    </header>

    <main>
      <section class="hero">
        <div class="hero-copy">
          <p class="kicker"><span>NEW STORIES</span> 每個生命都值得被找到</p>
          <h1>不是收養一隻寵物，<br />是<span>認識一位朋友。</span></h1>
          <p class="intro">從第一眼相遇到回家的路上，我們陪伴毛孩找到真正屬於牠的家庭。</p>
          <div class="hero-actions">
            <button class="primary-button" type="button" data-scroll="#animals">認識等待中的毛孩 <b aria-hidden="true">↗</b></button>
            <button class="secondary-button" type="button" data-scroll="#about">我們如何幫助牠們</button>
          </div>
        </div>

        <div class="portrait" aria-label="等待領養的狗狗插圖">
          <div class="portrait-frame">
            <div class="portrait-sun"></div>
            <div class="dog-illustration" aria-hidden="true">
              <div class="dog-ear left"></div>
              <div class="dog-ear right"></div>
              <div class="dog-head">
                <div class="dog-face"></div>
                <div class="dog-eye left-eye"></div>
                <div class="dog-eye right-eye"></div>
                <div class="dog-muzzle"><div class="dog-nose"></div></div>
              </div>
              <div class="dog-body"></div>
              <div class="dog-collar"></div>
            </div>
          </div>
          <aside class="match-card">
            <span class="match-index">01</span>
            <div><strong>本週相見歡</strong><small>6 位毛孩已找到家庭</small></div>
            <span class="match-arrow" aria-hidden="true">→</span>
          </aside>
        </div>
      </section>

      <section class="animals" id="animals">
        <div class="section-heading">
          <p class="kicker">AVAILABLE FOR ADOPTION</p>
          <h2>他們正在等你。</h2>
          <div class="slider-controls" aria-label="換頁控制">
            <button type="button" aria-label="上一位">←</button>
            <button type="button" aria-label="下一位">→</button>
          </div>
        </div>

        <div class="animal-grid">
          <article class="animal-card" data-name="Mochi" tabindex="0">
            <div class="animal-photo moch">
              <span class="animal-emoji" aria-hidden="true">🐕</span>
              <span class="animal-status">親人友善</span>
            </div>
            <div class="animal-meta">
              <div><h3>Mochi</h3><p>柴犬混種 · 3 歲</p></div>
              <button type="button" aria-label="查看 Mochi 的資料">↗</button>
            </div>
          </article>
          <article class="animal-card" data-name="Lulu" tabindex="0">
            <div class="animal-photo cat">
              <span class="animal-emoji" aria-hidden="true">🐈</span>
              <span class="animal-status">安靜貼心</span>
            </div>
            <div class="animal-meta">
              <div><h3>Lulu</h3><p>米克斯 · 1 歲</p></div>
              <button type="button" aria-label="查看 Lulu 的資料">↗</button>
            </div>
          </article>
          <article class="animal-card" data-name="Theo" tabindex="0">
            <div class="animal-photo rabbit">
              <span class="animal-emoji" aria-hidden="true">🐇</span>
              <span class="animal-status">好奇活潑</span>
            </div>
            <div class="animal-meta">
              <div><h3>Theo</h3><p>垂耳兔 · 10 月</p></div>
              <button type="button" aria-label="查看 Theo 的資料">↗</button>
            </div>
          </article>
        </div>
      </section>

      <section class="about" id="about">
        <p class="kicker">SMALL STEPS, BIG LOVE</p>
        <h2>領養不是結束，<br />而是故事開始的地方。</h2>
        <button class="text-link" type="button" data-scroll="#animals">閱讀我們的領養故事 <span>→</span></button>
      </section>
    </main>

    <div class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
