<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warm Paws</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="nav shell">
      <a class="brand" href="#" aria-label="Warm Paws 首頁">
        <span class="brand-mark" aria-hidden="true">🐾</span>
        <span>WARM PAWS</span>
      </a>
      <nav class="nav-links" aria-label="主要導覽">
        <a href="#adopt">尋找毛孩</a>
        <a href="#story">我們的故事</a>
        <a href="#visit">到訪資訊</a>
      </nav>
      <button class="nav-button" type="button" data-scroll="#adopt">領養一隻朋友</button>
    </header>

    <main>
      <section class="hero shell">
        <div class="hero-copy">
          <p class="eyebrow"><span></span> 等待一個溫暖的家</p>
          <h1>給牠一個家，<br /><em>牠會給你更多。</em></h1>
          <p class="lede">每隻毛孩都有獨特的個性與故事。一起找到最適合彼此的陪伴，讓生命從今天開始相遇。</p>
          <div class="hero-actions">
            <button class="primary" type="button" data-scroll="#adopt">認識等待領養的毛孩 <span aria-hidden="true">→</span></button>
            <button class="text-button" type="button" data-scroll="#story">了解領養流程 <span aria-hidden="true">↗</span></button>
          </div>
          <div class="trust-row" aria-label="機構成績">
            <div class="avatars" aria-hidden="true">
              <span>🐶</span><span>🐱</span><span>🐰</span>
            </div>
            <p><strong>1,284+</strong><br />個幸福家庭</p>
          </div>
        </div>

        <div class="hero-visual" aria-label="等待領養的狗狗">
          <div class="sun" aria-hidden="true"></div>
          <div class="arch">
            <div class="dog" aria-hidden="true">
              <div class="ear ear-left"></div>
              <div class="ear ear-right"></div>
              <div class="head">
                <div class="patch"></div>
                <div class="eye eye-left"></div>
                <div class="eye eye-right"></div>
                <div class="muzzle"><div class="nose"></div></div>
              </div>
              <div class="body"></div>
              <div class="paw paw-left"></div>
              <div class="paw paw-right"></div>
              <div class="collar"></div>
            </div>
          </div>
          <div class="floating-card">
            <span class="status-dot"></span>
            <div><strong>今天有新朋友！</strong><small>新毛孩剛加入</small></div>
          </div>
        </div>
      </section>

      <section class="adoption shell" id="adopt">
        <div class="section-heading">
          <div>
            <p class="eyebrow"><span></span> WAITING FOR YOU</p>
            <h2>遇見你的新家人</h2>
          </div>
          <button class="outline" type="button">查看全部 <span aria-hidden="true">→</span></button>
        </div>

        <div class="animal-grid">
          <article class="animal-card featured" data-animal="luna" tabindex="0">
            <div class="photo dog-photo"><span aria-hidden="true">🐕</span><span class="tag">最適合家庭</span></div>
            <div class="animal-info"><div><h3>Luna</h3><p>米格魯 · 2 歲</p></div><button type="button" aria-label="查看 Luna">↗</button></div>
          </article>
          <article class="animal-card" data-animal="milo" tabindex="0">
            <div class="photo cat-photo"><span aria-hidden="true">🐈</span><span class="tag">親人溫順</span></div>
            <div class="animal-info"><div><h3>Milo</h3><p>米克斯 · 1 歲</p></div><button type="button" aria-label="查看 Milo">↗</button></div>
          </article>
          <article class="animal-card" data-animal="coco" tabindex="0">
            <div class="photo rabbit-photo"><span aria-hidden="true">🐇</span><span class="tag">活力好奇</span></div>
            <div class="animal-info"><div><h3>Coco</h3><p>垂耳兔 · 8 月</p></div><button type="button" aria-label="查看 Coco">↗</button></div>
          </article>
        </div>
      </section>
    </main>

    <div class="toast" role="status" aria-live="polite"></div>
    <script src="/app.js"></script>
  </body>
</html>
